[versions]
paper = "1.21.11-R0.1-SNAPSHOT"
adventure = "4.17.0"
hikari = "5.0.1"
sqlite = "3.47.1.0"
vault = "1.7"
placeholderapi = "2.11.7"
bluemap = "2.7.7"

[libraries]
# Paper API
paper-api = { group = "io.papermc.paper", name = "paper-api", version.ref = "paper" }

# Vault
vault = { group = "com.github.MilkBowl", name = "VaultAPI", version.ref = "vault" }

# PlaceholderAPI
placeholderapi = { group = "me.clip", name = "placeholderapi", version.ref = "placeholderapi" }

# BlueMap
bluemap = { group = "de.bluecolored", name = "bluemap-api", version.ref = "bluemap" }

# Database
hikari = { group = "com.zaxxer", name = "HikariCP", version.ref = "hikari" }
sqlite = { group = "org.xerial", name = "sqlite-jdbc", version.ref = "sqlite" }

# Adventure (unified version)
adventure-minimessage = { group = "net.kyori", name = "adventure-text-minimessage", version.ref = "adventure" }
adventure-serializer-plain = { group = "net.kyori", name = "adventure-text-serializer-plain", version.ref = "adventure" }
adventure-serializer-legacy = { group = "net.kyori", name = "adventure-text-serializer-legacy", version.ref = "adventure" }

[plugins]
runPaper = { id = "xyz.jpenilla.run-paper", version = "2.3.1" }
shadow = { id = "com.gradleup.shadow", version = "9.1.0" }
