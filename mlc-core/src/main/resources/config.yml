#单词计数
words: 0

#所有玩家
players:
  - Mr_bl
# 资源包从 plugins/respack 自动压缩上传；旧的 resourcepack 链接配置不再使用。
#公告
gonggao: "当前活动：\n在生存服破坏方块，
放置方块均可获得1分数\n使用/scoretop获取排名前三玩家分数，
使用/getscore获取自己当前的活动分数\n\n本次活动设置奖项为限定帽子"


# Shift 右键可举起的实体类型（使用 Bukkit EntityType 名称，修改后重启）
mobmove:
  allowed-entities:
    - PLAYER
    - PIG
    - COW
    - SHEEP
    - CHICKEN
    -

# Xaero 地图玩家追踪，修改后需要重启。
xaero-map:
  enabled: true
  only-sync-same-world: true
  sync-interval-ticks: 5
  # 已有服务端实现发送 level ID 时可关闭。首次启用时会自动生成并保存 level-id。
  send-level-id: true

# 在线时长和经济排行榜 HTTP API，修改后重启生效。
web:
  enabled: true
  # 穿透客户端和服务端同机时使用回环地址。异机时改为服务端可达的内网地址。
  bind-address: "127.0.0.1"
  port: 8090
