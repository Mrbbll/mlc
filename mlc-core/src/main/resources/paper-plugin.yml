name: mlc
version: ${version}
main: com.mlc.mlc.Mlc
description: MLC server core plugin
api-version: '26.3'
bootstrapper: com.mlc.mlc.MlcBootstrap
authors: [Mr_bl]
dependencies:
  server:
    PlaceholderAPI:
      load: BEFORE
      required: true
      join-classpath: true
    Vault:
      load: BEFORE
      required: true
      join-classpath: true
    BlueMap:
      load: BEFORE
      required: false
      join-classpath: true
    CraftEngine:
      load: BEFORE
      required: false
      join-classpath: false
    ProtocolLib:
      load: BEFORE
      required: false
      join-classpath: true
    ProtocolSupport:
      load: BEFORE
      required: false
      join-classpath: true
    ViaVersion:
      load: BEFORE
      required: false
      join-classpath: true
    ViaBackwards:
      load: BEFORE
      required: false
      join-classpath: true
    ViaRewind:
      load: BEFORE
      required: false
      join-classpath: true
    Geyser-Spigot:
      load: BEFORE
      required: false
      join-classpath: true
    FastAsyncWorldEdit:
      load: BEFORE
      required: true
      join-classpath: true
    BetterModel:
      load: BEFORE
      required: false
      join-classpath: true
permissions:
  mlc.op:
    description: "管理 MLC"
    default: op
  mlc.bot:
    description: "生成和移除自己的 PvP 机器人"
    default: op
