name: mlc
version: ${version}
main: com.mlc.mlc.Mlc
description: MLC server core plugin
api-version: '26.3'
bootstrapper: com.mlc.mlc.MlcBootstrap
authors: [Mr_bl]
dependencies:
  server:
    PlaceholderAPI:
      load: BEFORE
      required: true
      join-classpath: true
    Vault:
      load: BEFORE
      required: true
      join-classpath: true
    BlueMap:
      load: BEFORE
      required: false
      join-classpath: true
permissions:
  mlc.bot:
    description: "生成和移除自己的 PvP 机器人"
    default: op
commands:
  item:
    description: "展示物品"
  mlcreload:
    description: "重载配置"
    permission: mlc.op
  mlcitem:
    description: "打开mlc物品菜单"
    permission: mlc.op
  mail:
    description: "打开邮箱、发送邮件或给所有人发送邮件"
    usage: "/mail 或 /mail send <玩家名> 或 /mail sendtoall"
  tpa:
    description: "请求传送"
  tpahere:
    description: "请求传送到自己位置"
  tpaccept:
    description: "同意请求"
  sethome:
    description: "设置家"
  delhome:
    description: "删除家"
  home:
    description: "回到家"
  sit:
    description: "坐下"
  back:
    description: "回到上个路径点"
  money:
    description: "操作货币"
  rtp:
    description: "随机传送"
  menu:
    description: "打开MLC功能菜单"
  reloadwaystone:
    description: "重新加载传送石碑"
    permission: mlcwaystone.reload
