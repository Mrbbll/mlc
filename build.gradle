plugins {
    id 'java'
    id("xyz.jpenilla.run-paper") version "2.3.1"
    id("com.gradleup.shadow") version "9.1.0"
}

group = 'com.mlc'
version = '1.0.0'

repositories {
    mavenCentral()
    maven {
        name = "papermc-repo"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
    maven {
        name = "sonatype"
        url = "https://oss.sonatype.org/content/groups/public/"
    }
    maven {
        name = "Vault"
        url = "https://jitpack.io" }
    maven {
        url = 'https://repo.extendedclip.com/releases/'
    }
}

dependencies {
    compileOnly("io.papermc.paper:paper-api:1.21.11-R0.1-SNAPSHOT")
    compileOnly("com.github.MilkBowl:VaultAPI:1.7") {
        exclude group: 'org.bukkit', module: 'bukkit'
    }
    compileOnly 'me.clip:placeholderapi:2.11.7'
    implementation 'net.kyori:adventure-text-minimessage:4.13.0'
    implementation 'org.xerial:sqlite-jdbc:3.47.1.0'
    implementation 'com.zaxxer:HikariCP:5.0.1'
}

shadowJar {
    relocate 'com.zaxxer.hikari', 'com.mlc.mlcdomain.lib.hikari'
//    relocate 'org.sqlite', 'com.mlc.mlcdomain.lib.sqlite'
}

build.dependsOn(shadowJar)

tasks {
  runServer {
    // Configure the Minecraft version for our task.
    // This is the only required configuration besides applying the plugin.
    // Your plugin's jar (or shadowJar if present) will be used automatically.
    minecraftVersion("1.21.8")
  }
}

def targetJavaVersion = 21
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << "-Xlint:deprecation"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release.set(targetJavaVersion)
    }
}

def versionpropsfile = file('version.properties')
def props = new Properties()
props.load(new FileInputStream(versionpropsfile))
def currentVersion = props['version'].toString()
def (versionMajor, versionMinor, versionPatch) = currentVersion.tokenize('.').collect { it.toInteger() }
def newVersion = "${versionMajor}.${versionMinor}.${versionPatch + 1}" as String
props['version'] = newVersion
props.store(versionpropsfile.newWriter(), null)
version = props['version']

processResources {
    inputs.property('version', version)
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand version: version
    }
}
